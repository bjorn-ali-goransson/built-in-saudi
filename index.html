<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Security: Referrer-Policy is one of the few security headers that a <meta>
         can actually set (X-Frame-Options / X-Content-Type-Options / HSTS are
         header-only and GitHub Pages can't emit them — those need a proxy). -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Built in Saudi — Free, honest online tools</title>
    <meta
      name="description"
      content="A growing toolbox of fast, free, privacy-first utilities — no ads, no sign-ups, nothing uploaded. Everything runs in your browser. Proudly built in Saudi Arabia."
    />
    <link rel="canonical" href="https://built-in-saudi.com/" />
    <meta name="theme-color" content="#0b3d2e" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Built in Saudi" />
    <meta property="og:title" content="Built in Saudi — Free, honest online tools" />
    <meta
      property="og:description"
      content="Fast, free, privacy-first utilities. No ads, no sign-ups, nothing uploaded. Built in Saudi Arabia."
    />
    <meta property="og:url" content="https://built-in-saudi.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://built-in-saudi.com/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Built in Saudi — Free, honest online tools" />
    <meta name="twitter:description" content="Fast, free, privacy-first utilities. No ads, no sign-ups, nothing uploaded. Built in Saudi Arabia." />
    <meta name="twitter:image" content="https://built-in-saudi.com/og.svg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- PWA / installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Built in Saudi" />

    <!-- Fonts: Fraunces (display) · Hanken Grotesk (body) · JetBrains Mono · IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics (GA4) — property "built-in-saudi.com" -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BPWYMJ8D8R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      // Cookieless, via Consent Mode. This MUST come before `config` — GA reads
      // consent when it initialises, so setting it afterwards is too late and the
      // cookie is already written. (`client_storage: 'none'` is a Universal
      // Analytics parameter; GA4 ignores it and sets _ga anyway — verified.)
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      gtag('js', new Date());
      // With analytics_storage denied there is no client id, so each visit counts on
      // its own: "users" inflates and returning-visitor metrics stop being meaningful.
      // Page/event counts and traffic sources are unaffected.
      gtag('config', 'G-BPWYMJ8D8R', {
        anonymize_ip: true,
        ads_data_redaction: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
