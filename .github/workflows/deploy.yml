name: Deploy to GitHub Pages

# Runs on every push to main AND on pull requests. The e2e suite gates the deploy:
# nothing reaches Pages unless typecheck, build and the full Playwright run pass.
# PRs get the same verification but never publish (see the `if` on `deploy`) — so a
# PR, including one from a fork, is checked before anyone merges it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy-pages action to publish, and cancel superseded runs.
permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so a PR run never cancels the deploy of main (or another PR).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A JOB TIMEOUT LOOKS LIKE SOMEBODY CANCELLING THE RUN. Run 640 ended
    # `cancelled` at 25m15s with nothing red, because the whole suite then ran in
    # this job and outgrew its budget; GitHub writes a spent budget as "The
    # operation was canceled". The signature: conclusion `cancelled`, no failing
    # test, and a runtime equal to the timeout. The suite is now in the `e2e`
    # shards, so this job is install + checks + build — but a cold npm cache
    # alone once took 7 minutes, which is what this budget leaves room for.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The pure halves of the office editors and Messages — formula engine,
      # .docx/.xlsx/.pptx readers and writers against real fixtures, the
      # convergence fuzz for live co-editing — are unit-tested. Seconds, and
      # they catch what a browser case can only see as a wrong render.
      #
      # python-docx, openpyxl and python-pptx read our exports back: somebody
      # else's implementation agreeing is the evidence, not our own reader.
      # Without them those cases skip, which in the gate would mean never.
      # A setup-python interpreter, because the runner's system Python refuses
      # a plain pip install (PEP 668: externally managed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Third-party readers for the export checks
        run: python -m pip install --quiet python-docx openpyxl python-pptx

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # The e2e shards test THIS dist, not a rebuild of their own: one build,
      # handed on, so every shard checks exactly the artifact that is published.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: dist

  # THE SUITE IS SPLIT, NOT TRIMMED. It was one job of 17–22 minutes, most of a
  # deploy; four shards run it in parallel on four runners, so the deploy waits
  # on the slowest quarter. Every case still runs on every push — choosing which
  # specs a change "affects" was rejected, because most tools share lib/ and a
  # gate that guesses is how a regression ships green.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one red shard should not hide what the others found
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Only chromium — the suite's single project. --with-deps pulls the system
      # libraries the browser needs on a bare runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config serves the downloaded dist via `vite preview`, so this
      # tests exactly the artifact that is about to be published.
      - name: End-to-end tests (shard ${{ matrix.shard }} of 4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      # Keep the report when something fails, so a red deploy is diagnosable without
      # re-running anything locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, e2e]
    # Verification runs for pull requests; publishing does not.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
